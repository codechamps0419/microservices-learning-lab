server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api
spring:
  application:
    name: order-service
  profiles:
    default: local
  datasource:
    url: ${app.database.url}
    username: ${app.database.username}
    password: ${app.database.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  database:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
clients:
  product:
    service-name: ${PRODUCT_SERVICE_NAME:product-service}
    connect-timeout: ${PRODUCT_CONNECT_TIMEOUT:3s}
    read-timeout: ${PRODUCT_READ_TIMEOUT:5s}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
